name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs deploy production at once.
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Bangkok

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # This lockfile was last generated on Windows, so it's missing the
      # Linux optional-dependency entries (native bindings) `npm ci` demands
      # for the runner's platform — same issue the Dockerfile works around.
      # `npm install` re-resolves those instead of hard-failing.
      - run: npm install
      - run: npm run lint
      # tsc's `include` covers .next/types/**, generated by a build/dev run —
      # generate those route types before checking TypeScript.
      - run: npx next typegen
      - run: npx tsc --noEmit

  build-and-push:
    needs: [test]
    # PR runs only gate on tests. Manual production deployment is allowed from
    # main only; a dispatch from any other ref cannot push or deploy an image.
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR (and OCI registries generally) require lowercase repository names.
      - name: Lowercase the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # NEXT_PUBLIC_* is compiled into the client bundle at build time.
          # These are EmailJS's public-facing IDs, safe to keep as repo vars.
          build-args: |
            NEXT_PUBLIC_EMAILJS_SERVICE_ID=${{ vars.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
            NEXT_PUBLIC_EMAILJS_TEMPLATE_ID=${{ vars.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
            NEXT_PUBLIC_EMAILJS_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:latest-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push]
    if: always() && needs['build-and-push'].result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      # The server also pulls repository changes so docker-compose.yml changes
      # ship together with the image.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.SERVER_APP_DIR }}
            git pull
            docker compose pull app
            docker compose up -d app
            docker image prune -f

  notify:
    needs: [test, build-and-push, deploy]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi

          REPO="${{ github.event.repository.name }}"

          if [ "${{ needs.test.result }}" != "success" ]; then
            TITLE="[$REPO] Test ล้มเหลว"; COLOR=15158332
          elif [ "${{ needs['build-and-push'].result }}" != "success" ]; then
            TITLE="[$REPO] Build/push image ล้มเหลว"; COLOR=15158332
          elif [ "${{ needs.deploy.result }}" != "success" ]; then
            TITLE="[$REPO] Deploy ล้มเหลว"; COLOR=15158332
          else
            TITLE="[$REPO] Deploy สำเร็จ"; COLOR=3066993
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "**commit:** [\`${{ github.sha }}\`]($COMMIT_URL)
          **by:** ${{ github.actor }}
          [ดู log]($RUN_URL)" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, description: $desc, color: $color}]}')

          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$WEBHOOK"
